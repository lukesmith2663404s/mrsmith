<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>The Wheel Settings</title>

  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/the-wheel.css" />

  <script
    src="../../js/question-generator.js"
    defer
  ></script>

  <script src="settings.js" defer></script>
</head>

<body class="wheel-page wheel-settings-page">
  <main class="wheel-settings-wrapper">
    <section class="wheel-settings-card">
      <a
        class="wheel-back-link"
        href="../../index.html"
      >
        ← Games
      </a>

      <h1>The Wheel</h1>

      <p class="wheel-intro">
        Choose built-in questions or external-question mode.
      </p>

      <form id="wheelSettingsForm">
        <section class="wheel-basic-settings">
          <label for="roundCountInput">
            Rounds
            <input
              id="roundCountInput"
              type="number"
              min="1"
              max="20"
              step="1"
              value="6"
            />
          </label>

          <label for="playerCountInput">
            Players / teams
            <input
              id="playerCountInput"
              type="number"
              min="1"
              max="8"
              step="1"
              value="1"
            />
          </label>
        </section>

        <fieldset class="wheel-mode-settings">
          <legend>Question mode</legend>

          <div class="wheel-mode-options">
            <label class="wheel-mode-option">
              <input
                type="radio"
                name="questionMode"
                value="built-in"
              />

              <span>
                <strong>Built-in questions</strong>
                <span>
                  The Wheel asks and checks a generated question.
                </span>
              </span>
            </label>

            <label class="wheel-mode-option">
              <input
                type="radio"
                name="questionMode"
                value="external"
                checked
              />

              <span>
                <strong>External question</strong>
                <span>
                  The Wheel only shows Spin or Pass.
                </span>
              </span>
            </label>
          </div>
        </fieldset>

        <section
          id="wheelQuestionSection"
          class="wheel-topic-section"
        >
          <div class="wheel-topic-heading">
            <div>
              <h2>Question types</h2>
              <p>
                Select the questions used in built-in mode.
              </p>
            </div>

            <div class="wheel-selection-shortcuts">
              <button
                id="selectAllButton"
                type="button"
              >
                Select All
              </button>

              <button
                id="clearAllButton"
                type="button"
              >
                Clear
              </button>
            </div>
          </div>

          <div
            id="questionChecklist"
            class="wheel-question-checklist"
          ></div>
        </section>

        <p
          id="settingsError"
          class="wheel-settings-error"
          aria-live="polite"
        ></p>

        <div class="wheel-settings-actions">
          <button
            class="wheel-primary-button"
            type="submit"
          >
            Start Game
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
