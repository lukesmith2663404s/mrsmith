<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Number</title>

    <link rel="stylesheet" href="../../css/secret-number.css">
</head>

<body>

<div class="crt-overlay"></div>
<div class="scanlines"></div>

<header class="top-bar">

    <div class="top-bar-left">

        <a
            class="back-button"
            href="../../index.html"
        >
            ← Back to Games
        </a>

        <a
            class="settings-button"
            href="settings.html"
        >
            Settings
        </a>

    </div>

    <h1>
        Secret Number
    </h1>

</header>

<div class="page">


<main class="terminal">

    <div
        id="history"
        class="terminal-output"
    >

    </div>

    <div class="terminal-input-row">

        <span class="prompt">
            >
        </span>

        <input
            id="terminalInput"
            autocomplete="off"
            spellcheck="false"
            placeholder="Ask a question..."
        >


</main>

</div>

<!-- ========================= -->
<!-- RESULT POPUP             -->
<!-- ========================= -->

<div
    id="resultOverlay"
    class="result-overlay hidden"
>

    <div
        id="resultBox"
        class="result-box"
    >

        <h2 id="resultTitle">

            Secret Number Found!

        </h2>

        <p id="resultText">

        </p>

        <button
            id="continueButton"
        >

            Continue

        </button>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
