<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secret Number Settings</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/secret-number.css">
</head>

<body class="secret-number-settings-body">

<header class="top-bar">

    <a
        class="back-button"
        href="../../index.html"
    >
        ← Back to Games
    </a>

    <h1>
        Secret Number
    </h1>

</header>

<main class="secret-number-settings">

    <section class="secret-number-settings-card">

        <div class="secret-number-mode">

            <label class="secret-number-mode-option">

                <input
                    type="radio"
                    name="mode"
                    value="manual"
                    checked
                >

                <span>Enter Number</span>

            </label>

            <label class="secret-number-mode-option">

                <input
                    type="radio"
                    name="mode"
                    value="random"
                >

                <span>Random Number</span>

            </label>

        </div>

        <div
            id="manualSection"
            class="secret-number-setting-section"
        >

            <label
                class="secret-number-field"
                for="manualNumber"
            >
                Secret Number

                <input
                    id="manualNumber"
                    type="password"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="Enter secret number"
                >
            </label>

        </div>

        <div
            id="randomSection"
            class="secret-number-setting-section hidden"
        >

            <div class="secret-number-range">

                <label
                    class="secret-number-field"
                    for="minimumNumber"
                >
                    Minimum

                    <input
                        id="minimumNumber"
                        type="number"
                        value="1"
                        step="1"
                    >

                </label>

                <label
                    class="secret-number-field"
                    for="maximumNumber"
                >
                    Maximum

                    <input
                        id="maximumNumber"
                        type="number"
                        value="100"
                        step="1"
                    >

                </label>

            </div>

        </div>

        <button
            id="startButton"
            class="primary-button secret-number-start-button"
            type="button"
        >
            Start Game
        </button>

    </section>

</main>

<script src="settings.js"></script>

</body>
</html>
